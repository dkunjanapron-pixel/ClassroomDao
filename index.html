<script>
    // ==========================================
    // 1. กำหนดค่าเริ่มต้นและลิงก์ Google Apps Script
    // ==========================================
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx0xhyEqMR_v_1iRGBBX0L67MC0L3jRS4qEFMAqqx_cMyNBSToUb3h-7cvBP2wNzOX6/exec';
    const todayStr = new Date().toISOString().split('T')[0];

    // โครงสร้าง State หลักของระบบ
    let state = {
        currentClass: '201',
        currentTab: 'attendance',
        classes: [
            { id: '201', name: 'ห้อง 201', scriptUrl: SCRIPT_URL },
            { id: '202', name: 'ห้อง 202', scriptUrl: SCRIPT_URL }
        ],
        sheetsLinks: [],
        students: typeof INITIAL_STUDENTS !== 'undefined' ? INITIAL_STUDENTS : {},
        attendance: {},
        assignments: { cols: [], scores: {} },
        exams: { cols: [], scores: {} },
        final: { cols: [{ id: 'f1', name: 'ปลายภาค', max: 20 }], scores: {} },
        miniproject: { cols: [{ id: 'm1', name: 'ชิ้นงาน', max: 10 }], scores: {} },
        behavior: { cols: [], scores: {} }
    };

    // โหลดข้อมูลจาก LocalStorage พร้อมแทนที่ Script URL อัตโนมัติ
    function loadState() {
        const saved = localStorage.getItem('classMeData') || localStorage.getItem('classroomProData');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                state = { ...state, ...parsed };

                // ตรวจสอบและอัปเดต URL อัตโนมัติ ป้องกันปัญหาค้างค่าว่างจากแคชเดิม
                if (state.classes && Array.isArray(state.classes)) {
                    state.classes.forEach(c => {
                        if (!c.scriptUrl || c.scriptUrl.includes('...')) {
                            c.scriptUrl = SCRIPT_URL;
                        }
                    });
                }
            } catch (e) {
                console.error('Error loading state:', e);
            }
        }
    }

    // บันทึกข้อมูลลงใน LocalStorage ของเบราว์เซอร์
    function saveState() {
        localStorage.setItem('classMeData', JSON.stringify(state));
    }

    // ==========================================
    // 2. ฟังก์ชันบันทึกข้อมูลเข้า Google Sheets (Online)
    // ==========================================

    // บันทึกการเช็คชื่อเข้า Google Sheets
    function saveToSheet() {
        const dateInput = document.getElementById('attendance-date');
        const date = dateInput ? dateInput.value || todayStr : todayStr;
        const statusBox = document.getElementById('save-status');

        if (statusBox) {
            statusBox.className = 'px-4 py-2 rounded-xl text-xs font-bold w-full xl:w-auto text-center bg-sky-100 text-sky-800';
            statusBox.innerText = 'กำลังส่งข้อมูลเช็คชื่อไปยัง Google Sheets...';
            statusBox.classList.remove('hidden');
        }

        const currentStudents = typeof getFilteredStudents === 'function' ? getFilteredStudents() : (state.students[state.currentClass] || []);
        const records = currentStudents.map(s => ({
            id: s.id,
            no: s.no,
            name: s.name,
            status: state.attendance[date]?.[s.id] || ''
        })).filter(r => r.status !== '');

        const currentClassObj = state.classes.find(c => c.id === state.currentClass);
        const targetUrl = currentClassObj?.scriptUrl || SCRIPT_URL;

        const payload = {
            action: 'save_attendance',
            date: date,
            classRoom: state.currentClass,
            records: records,
            fullState: state // สำรอง State ทั้งหมด
        };

        fetch(targetUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            if (statusBox) {
                statusBox.className = 'px-4 py-2 rounded-xl text-xs font-bold w-full xl:w-auto text-center bg-emerald-100 text-emerald-800';
                statusBox.innerText = 'บันทึกการเช็คชื่อเข้า Google Sheets สำเร็จ!';
                setTimeout(() => statusBox.classList.add('hidden'), 3500);
            }
        }).catch(err => {
            console.error(err);
            if (statusBox) {
                statusBox.className = 'px-4 py-2 rounded-xl text-xs font-bold w-full xl:w-auto text-center bg-rose-100 text-rose-800';
                statusBox.innerText = 'เกิดข้อผิดพลาดในการส่งข้อมูลเข้า Google Sheets';
            }
        });
    }

    // บันทึกคะแนนทั้งหมดเข้า Google Sheets
    function saveScoresToSheet() {
        const currentClassObj = state.classes.find(c => c.id === state.currentClass);
        const targetUrl = currentClassObj?.scriptUrl || SCRIPT_URL;
        const btn = document.getElementById('btn-save-scores');

        if (btn) btn.innerText = '⏳ กำลังบันทึกคะแนน...';

        const currentStudents = typeof getFilteredStudents === 'function' ? getFilteredStudents() : (state.students[state.currentClass] || []);
        const scoresList = currentStudents.map(s => {
            const aScores = Object.values(state.assignments?.scores?.[s.id] || {}).map(Number).filter(n => !isNaN(n));
            const aTotal = aScores.reduce((sum, v) => sum + v, 0);

            const eScores = Object.values(state.exams?.scores?.[s.id] || {}).map(Number).filter(n => !isNaN(n));
            const eTotal = eScores.reduce((sum, v) => sum + v, 0);

            const fScore = parseFloat(state.final?.scores?.[s.id]?.f1) || 0;
            const mScore = parseFloat(state.miniproject?.scores?.[s.id]?.m1) || 0;

            const bScores = Object.values(state.behavior?.scores?.[s.id] || {}).map(Number).filter(n => !isNaN(n));
            const bTotal = bScores.reduce((sum, v) => sum + v, 0);

            return {
                no: s.no,
                id: s.id,
                name: s.name,
                assignmentScore: aTotal,
                examScore: eTotal,
                finalScore: fScore,
                miniProjectScore: mScore,
                behaviorScore: bTotal,
                totalScore: (aTotal + eTotal + fScore + mScore + bTotal).toFixed(2)
            };
        });

        const payload = {
            action: 'save_scores',
            classRoom: state.currentClass,
            scoresList: scoresList,
            fullState: state
        };

        fetch(targetUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            alert('บันทึกคะแนนเข้า Google Sheets สำเร็จเรียบร้อย!');
            if (btn) btn.innerText = '☁️ บันทึกคะแนนลง Sheets';
        }).catch(err => {
            console.error(err);
            alert('เกิดข้อผิดพลาดในการบันทึกคะแนน');
            if (btn) btn.innerText = '☁️ บันทึกคะแนนลง Sheets';
        });
    }

    // ดึงข้อมูลออนไลน์จาก Google Sheets มาอัปเดตบนหน้าเว็บ
    function loadFromSheet() {
        if (!confirm('ต้องการดึงข้อมูลล่าสุดจาก Google Sheets มาแทนที่ข้อมูลบนเครื่องนี้ใช่หรือไม่?')) return;

        fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                if (data && data.fullState) {
                    state = { ...state, ...data.fullState };
                    saveState();
                    if (typeof renderAll === 'function') renderAll();
                    else location.reload();
                    alert('ดึงข้อมูลจาก Google Sheets สำเร็จเรียบร้อย!');
                } else {
                    alert('ยังไม่พบข้อมูลที่บันทึกไว้บน Google Sheets');
                }
            })
            .catch(err => {
                console.error(err);
                alert('ไม่สามารถดึงข้อมูลได้ โปรดตรวจสอบการเชื่อมต่ออินเทอร์เน็ต');
            });
    }

    // โหลด State เมื่อเปิดหน้าเว็บ
    loadState();
</script>
